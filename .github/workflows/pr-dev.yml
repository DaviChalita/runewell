name: CI – Build Docker & Check Django

on:
  pull_request:
    branches:
      - dev   # dispara quando alguém abre PR para a branch dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout do código
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Configurar Python e dependências
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 3️⃣ Testar se o Django consegue rodar o collectstatic e checar migrations
      - name: Check Django
        run: |
          python manage.py check
          python manage.py collectstatic --noinput

      # 4️⃣ Testar se o Docker build funciona (opcional, sem rodar containers)
      - name: Docker Build Test
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          load: true