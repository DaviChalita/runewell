name: Deploy Django to EC2

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout do código
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Configurar SSH
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # 3️⃣ Deploy na EC2 com variáveis direto no shell
      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/ec2.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e

            # Clonar ou atualizar repositório
            if [ ! -d runewell ]; then
              git clone git@github.com:DaviChalita/runewell.git runewell
            fi

            cd runewell
            git fetch
            git checkout dev
            git pull origin dev

            # Exportar variáveis de ambiente para o shell
            export DB_NAME='${{ secrets.DB_NAME }}'
            export DB_USER='${{ secrets.DB_USER }}'
            export DB_PASSWORD='${{ secrets.DB_PASSWORD }}'
            export DB_HOST='${{ secrets.DB_HOST }}'
            export DB_PORT='${{ secrets.DB_PORT }}'
            export DJANGO_SECRET_KEY='${{ secrets.DJANGO_SECRET_KEY }}'

            # Build e deploy com Docker Compose
            docker compose -f runewell/docker-compose.yml up -d --build
          EOF