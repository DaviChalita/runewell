<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ card.name }} · Runewell</title>

    <!-- Base reset + layout geral -->
    <link rel="stylesheet" href="{% static 'card/styles/styles.css' %}">
    <!-- Header -->
    <link rel="stylesheet" href="{% static 'card/styles/header.css' %}">
    <!-- (opcional) footer.css se você separou -->
    <link rel="stylesheet" href="{% static 'card/styles/footer.css' %}">
    <link rel="stylesheet" href="{% static 'card/styles/card_detail.css' %}">

</head>

<body class="body">
    {% include "bases/header.html" %}

 <main class="card-detail-page">
    <div class="card-detail-layout">

        <!-- Carta -->
        <div class="card-detail-image">
            <img
                src="{{ card.image }}"
                alt="{{ card.name }}"
            />
        </div>

        <!-- Informações -->
        <div class="card-detail-info">

            <div class="card-section card-section--title">
                <h1>
                    {{ card.name }}
                    {% if card.cost %}
                        <span class="card-cost">· {{ card.cost }}</span>
                    {% endif %}
                </h1>
            </div>

            <div class="card-section">
                <div class="card-type">
                    {{ card.type }}
                </div>
            </div>

            <div class="card-section card-section--text">
                {{ card.effect|safe }}
            </div>

            {% if card.might %}
            <div class="card-section">
                <strong>Might:</strong> {{ card.might }}
            </div>
            {% endif %}

        </div>

    </div>
</main>


    {% include "bases/footer.html" %}
</body>
</html>
