<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Search · Riftbound</title>
    <link rel="stylesheet" href="{% static 'styles/styles.css' %}">
    <link rel="stylesheet" href="{% static 'styles/header.css' %}">
    <link rel="stylesheet" href="{% static 'styles/advanced_search.css' %}">
    <link rel="stylesheet" href="{% static 'styles/footer.css' %}">

</head>
<body class="body">
<!-- HEADER -->
{% include "bases/header.html" %}
<main class="advanced-container">
    <form method="get" action="{% url 'list' %}" class="advanced-form">

        <div class="filter-group">
            <label for="name">Card Name</label>
            <input type="text" name="name" id="name">
        </div>

        <div class="filter-group">
            <label for="effect">Effect</label>
            <div>
                <input type="text" name="effect" id="effect" placeholder='Any effect text, e.g. "draw"'>
                <div class="help-text">
                    Enter text that should appear in the effect rules.
                </div>
            </div>
        </div>

        <div class="filter-group">
            <label>Domains</label>
            <div class="domains">
                <label><input type="checkbox" name="domain" value="Fury">
                    <img src="https://static.dotgg.gg/riftbound/text/rb_rune_fury.svg"> Fury</label>
                <label><input type="checkbox" name="domain" value="Calm">
                    <img src="https://static.dotgg.gg/riftbound/text/rb_rune_calm.svg"> Calm</label>
                <label><input type="checkbox" name="domain" value="Mind">
                    <img src="https://static.dotgg.gg/riftbound/text/rb_rune_mind.svg"> Mind</label>
                <label><input type="checkbox" name="domain" value="Body">
                    <img src="https://static.dotgg.gg/riftbound/text/rb_rune_body.svg"> Body</label>
                <label><input type="checkbox" name="domain" value="Chaos">
                    <img src="https://static.dotgg.gg/riftbound/text/rb_rune_chaos.svg"> Chaos</label>
                <label><input type="checkbox" name="domain" value="Order">
                    <img src="https://static.dotgg.gg/riftbound/text/rb_rune_order.svg"> Order</label>
            </div>
        </div>

        <div class="filter-group">
            <label for="set">Set</label>
            <select name="set" id="set">
                <option value="">Any set</option>
                {% for set in sets %}
                <option value="{{ set }}">{{ set|capfirst }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-actions">
            <button type="submit">Search with these options</button>
        </div>

    </form>
</main>
{% include "bases/footer.html" %}
</body>
</html>
