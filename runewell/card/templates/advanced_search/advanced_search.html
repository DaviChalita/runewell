<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Search · Riftbound</title>
    <link rel="stylesheet" href="{% static 'card/styles/styles.css' %}">
    <link rel="stylesheet" href="{% static 'card/styles/header.css' %}">
    <link rel="stylesheet" href="{% static 'card/styles/advanced_search.css' %}">
    <link rel="stylesheet" href="{% static 'card/styles/footer.css' %}">

</head>
<body class="body">
<!-- HEADER -->
{% include "bases/header.html" %}
<main class="advanced-container">
    <form method="get" action="{% url 'list' %}" class="advanced-form">

        <div class="filter-group">
            <label for="name">Card Name</label>
            <input type="text" name="name" id="name">
        </div>

        <div class="filter-group">
            <label for="effect">Effect</label>
            <div>
                <input type="text" name="effect" id="effect" placeholder='Any effect text, e.g. "draw"'>
                <div class="help-text">
                    Enter text that should appear in the effect rules.
                </div>
            </div>
        </div>

        <div class="filter-group">
            <label>Domains</label>
            <div class="domains">
                <label><input type="checkbox" name="domain" value="Fury"> Fury</label>
                <label><input type="checkbox" name="domain" value="Calm"> Calm</label>
                <label><input type="checkbox" name="domain" value="Mind"> Mind</label>
                <label><input type="checkbox" name="domain" value="Body"> Body</label>
                <label><input type="checkbox" name="domain" value="Chaos"> Chaos</label>
                <label><input type="checkbox" name="domain" value="Order"> Order</label>
            </div>
        </div>

        <div class="filter-group">
            <label for="set">Set</label>
            <select name="set" id="set">
                <option value="">Any set</option>
                {% for set in sets %}
                <option value="{{ set }}">{{ set|capfirst }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-actions">
            <button type="submit">Search with these options</button>
        </div>

    </form>
</main>
{% include "bases/footer.html" %}
</body>
</html>
