version: '3.8'

services:
  web:
    build: .
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG_MODE: ${DEBUG_MODE}
    volumes:
      - static_volume:/app/staticfiles  # compartilha arquivos estáticos
    restart: always

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - static_volume:/app/staticfiles  # serve os estáticos
    depends_on:
      - web
    restart: always

volumes:
  static_volume: